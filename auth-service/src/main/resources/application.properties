# Application
spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# JWT
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.secret=${JWT_SECRET}
# dHTBCiYjy9/898l7oE+vGLXoZWmwAlMp+ogK11WeMNp7A6gESIiomSIYEavuIeivyNp26jQXdo1y3aCqticHDA==

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth-service-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASS}

# Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_URL:localhost}
spring.data.redis.port=6379
redis.duration=${REDIS_DURATION:86400000}

# optional tuning
#spring.cache.redis.time-to-live=1h
#spring.cache.redis.cache-null-values=false

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=AuthServiceHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

#Application Info
info.app.name=${spring.application.name}
info.app.description=Authentication Service
info.app.version=@project.version@

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null